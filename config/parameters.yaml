model:
  input_shape: [1, 1600]  # Example input shape for EEG data
  num_classes: 2  # Binary classification
  learning_rate: 0.001
  batch_size: 32
  epochs: 50

data:
  raw_data_path: "data/raw/"
  processed_data_path: "data/processed/"
  features_data_path: "data/features/"

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score

random_seed: 42