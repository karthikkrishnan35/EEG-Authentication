<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Authentication System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 20px;
        }
        .auth-result {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .authenticated {
            background-color: #d4edda;
            color: #155724;
        }
        .denied {
            background-color: #f8d7da;
            color: #721c24;
        }
        .eeg-plot {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center">EEG Authentication System</h1>
        
        <div class="row mt-4">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        Device Control
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Device Status:</label>
                            <span id="status-indicator" class="badge bg-danger">Disconnected</span>
                        </div>
                        <button id="connect-btn" class="btn btn-primary">Connect Device</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-header">
                        EEG Recording
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Recording Duration (seconds):</label>
                            <input type="number" id="duration" class="form-control" value="5" min="1" max="30">
                        </div>
                        <button id="record-btn" class="btn btn-success" disabled>Record & Authenticate</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div id="result-container" class="mt-4" style="display: none;">
            <div id="auth-result" class="auth-result"></div>
            <div class="text-center mb-3">
                <p id="confidence-text"></p>
            </div>
            <img id="eeg-plot" class="eeg-plot mb-4" src="" alt="EEG Plot">
        </div>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simulated EEG data generation for demo purposes
        // In a real app, this would come from your EEG device API
        function generateEEGData(duration, sampleRate = 128) {
            const samples = duration * sampleRate;
            const eegData = [
                Array.from({length: samples}, () => Math.random() * 50 - 25),
                Array.from({length: samples}, () => Math.random() * 40 - 20),
                Array.from({length: samples}, () => Math.random() * 60 - 30)
            ];
            return eegData;
        }
        
        // Elements
        const connectBtn = document.getElementById('connect-btn');
        const statusIndicator = document.getElementById('status-indicator');
        const recordBtn = document.getElementById('record-btn');
        const durationInput = document.getElementById('duration');
        const resultContainer = document.getElementById('result-container');
        const authResult = document.getElementById('auth-result');
        const confidenceText = document.getElementById('confidence-text');
        const eegPlot = document.getElementById('eeg-plot');
        
        let deviceConnected = false;
        
        // Connect button handler
        connectBtn.addEventListener('click', () => {
            if (!deviceConnected) {
                // Simulate connection
                setTimeout(() => {
                    deviceConnected = true;
                    statusIndicator.textContent = 'Connected';
                    statusIndicator.classList.replace('bg-danger', 'bg-success');
                    connectBtn.textContent = 'Disconnect Device';
                    recordBtn.disabled = false;
                }, 1000);
            } else {
                deviceConnected = false;
                statusIndicator.textContent = 'Disconnected';
                statusIndicator.classList.replace('bg-success', 'bg-danger');
                connectBtn.textContent = 'Connect Device';
                recordBtn.disabled = true;
            }
        });
        
        // Record button handler
        recordBtn.addEventListener('click', async () => {
            if (!deviceConnected) return;
            
            const duration = parseInt(durationInput.value) || 5;
            recordBtn.disabled = true;
            recordBtn.textContent = 'Recording...';
            
            try {
                // Simulate recording
                await new Promise(resolve => setTimeout(resolve, duration * 1000));
                
                // Generate sample EEG data (replace with actual device data)
                const eegData = generateEEGData(duration);
                
                // Send data to server for authentication
                const response = await fetch('/authenticate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ eeg_data: eegData }),
                });
                
                const result = await response.json();
                
                if (result.authenticated) {
                    authResult.textContent = 'AUTHENTICATED';
                    authResult.className = 'auth-result authenticated';
                } else {
                    authResult.textContent = 'ACCESS DENIED';
                    authResult.className = 'auth-result denied';
                }
                
                confidenceText.textContent = `Confidence: ${(result.confidence * 100).toFixed(2)}%`;
                eegPlot.src = `data:image/png;base64,${result.plot}`;
                resultContainer.style.display = 'block';
                
            } catch (error) {
                console.error('Authentication error:', error);
                alert('Authentication error: ' + error.message);
            } finally {
                recordBtn.disabled = false;
                recordBtn.textContent = 'Record & Authenticate';
            }
        });
    </script>
</body>
</html>
